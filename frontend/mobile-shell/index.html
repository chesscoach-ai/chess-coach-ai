<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#030712" />
    <title>Chess Clan</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #030712;
        color: #f8fafc;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      main {
        max-width: 360px;
      }

      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }

      p {
        color: #94a3b8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/app-icon-192.png" alt="Chess Clan" />
      <h1>Chess Clan</h1>
      <p>
        La version mobile doit être synchronisée avec une adresse HTTPS avant
        son lancement.
      </p>
    </main>
  </body>
</html>
