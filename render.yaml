services:
  - type: web
    name: chess-coach-api
    runtime: docker
    rootDir: backend
    region: frankfurt
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit

  - type: web
    name: chess-coach-web
    runtime: node
    rootDir: frontend
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NEXT_PUBLIC_API_URL
        value: /backend-api
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: chess-coach-api
          property: hostport
      - key: DATABASE_URL
        fromDatabase:
          name: chess-coach-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: chess-coach-db
    region: frankfurt
    plan: free
    databaseName: chess_coach
    user: chess_coach

previews:
  generation: manual
