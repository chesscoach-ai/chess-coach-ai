services:
  - type: web
    name: chess-coach-api
    runtime: docker
    rootDir: backend
    region: frankfurt
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BACKEND_API_SECRET
        generateValue: true
      - key: STOCKFISH_POOL_SIZE
        value: "1"
      - key: STOCKFISH_MAX_QUEUE_SIZE
        value: "6"
      - key: STOCKFISH_THREADS
        value: "1"
      - key: STOCKFISH_HASH_MB
        value: "32"

  - type: web
    name: chess-coach-web
    runtime: node
    rootDir: frontend
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: BACKEND_URL
        fromService:
          type: web
          name: chess-coach-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: BACKEND_API_SECRET
        fromService:
          type: web
          name: chess-coach-api
          envVarKey: BACKEND_API_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: chess-coach-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        fromService:
          type: web
          name: chess-coach-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: COMMERCIAL_LAUNCH_ENABLED
        value: "false"
      - key: ANALYSIS_PRICE_MONTHLY_CENTS
        value: "299"
      - key: ANALYSIS_PRICE_ANNUAL_CENTS
        value: "2499"
      - key: ANALYSIS_PREVIEW_EMAILS
        sync: false
      - key: LEGAL_ENTITY_NAME
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_REGISTRATION_NUMBER
        sync: false
      - key: LEGAL_PUBLICATION_DIRECTOR
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: PRIVACY_EMAIL
        sync: false
      - key: LEGAL_DOCUMENTS_REVIEWED
        value: "false"
      - key: LEGAL_TERMS_VERSION
        sync: false
      - key: LEGAL_PRIVACY_VERSION
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_ID_ANNUAL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: chess-coach-db
    region: frankfurt
    plan: free
    databaseName: chess_coach
    user: chess_coach
